[package]
name = "t3-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false }
gpui-kit = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false }
t3-client = { version = "0.1.0", path = "../t3-client" }
t3-host = { version = "0.1.0", path = "../t3-host" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"
raw-window-handle = "0.6"
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"

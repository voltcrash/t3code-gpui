name: Desktop (GPUI)

on:
  pull_request:
    paths:
      - "apps/desktop-gpui/**"
      # The integration tests drive the real server from source.
      - "apps/server/**"
      - "packages/**"
      - ".github/workflows/desktop-gpui.yml"
  push:
    branches:
      - gpui

permissions:
  contents: read

concurrency:
  group: desktop-gpui-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/desktop-gpui

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-gpui

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
